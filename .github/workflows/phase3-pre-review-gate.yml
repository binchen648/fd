name: Phase 3 Pre-Review Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: phase3-pre-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase3-promotion-policy:
    name: Phase 3 Promotion Lane / policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 3 task manifest policy
        if: github.event_name == 'pull_request'
        run: npm run phase3:ci-gate -- --verify-git-ancestry

      - name: Run Phase 3 governance focused tests
        run: npx vitest run scripts/tests/phase3-preflight.test.ts
